[tmc2209 manual_stepper dock_stepper]
uart_pin: PD12
run_current: 0.40
sense_resistor: 0.110
interpolate: false
stealthchop_threshold: 0

# Direct drive: units are degrees. 0 = home switch.
[manual_stepper dock_stepper]
step_pin: PD11
dir_pin: PD10
enable_pin: !PD13
microsteps: 16
rotation_distance: 360
full_steps_per_rotation: 200
velocity: 120
accel: 200
endstop_pin: ^!PE5
position_endstop: 0
position_min: -5
position_max: 180
homing_retract_dist: 0

[gcode_macro _PROBE_ARM]
description: Dock arm angles (degrees) and speeds
variable_park_angle: 6
variable_presentation_angle: 99.8
variable_move_speed: 60     # deg/s for D moves (F3000)
variable_home_speed: 100    # deg/s for homing moves
variable_home_accel: 60     # deg/s^2 for homing moves
gcode:
    RESPOND MSG="{printer['gcode_macro _PROBE_ARM']}"

# Home against the switch, go to park angle, register D. Motor stays on.
# BACKOFF=0 skips the initial 5 deg move away from the switch (used after
# stow separation, when the arm may be against its far stop).
[gcode_macro PROBE_ARM_HOME]
description: Home the dock arm, move to park angle and register D axis
gcode:
    {% set arm = printer['gcode_macro _PROBE_ARM'] %}
    {% set cfg = printer.configfile.settings['manual_stepper dock_stepper'] %}
    {% set s = arm.home_speed %}
    {% set a = arm.home_accel %}
    M400
    MANUAL_STEPPER STEPPER=dock_stepper GCODE_AXIS=
    MANUAL_STEPPER STEPPER=dock_stepper ENABLE=1
    {% if params.BACKOFF|default(1)|int %}
        MANUAL_STEPPER STEPPER=dock_stepper SET_POSITION=0
        MANUAL_STEPPER STEPPER=dock_stepper MOVE=5 SPEED={s} ACCEL={a}
    {% endif %}
    # Pretend we're at the far limit so the search covers the full range.
    MANUAL_STEPPER STEPPER=dock_stepper SET_POSITION={cfg.position_max}
    MANUAL_STEPPER STEPPER=dock_stepper MOVE={cfg.position_min} SPEED={s} ACCEL={a} STOP_ON_ENDSTOP=home
    MANUAL_STEPPER STEPPER=dock_stepper SET_POSITION=0
    MANUAL_STEPPER STEPPER=dock_stepper MOVE={arm.park_angle} SPEED={s} ACCEL={a}
    MANUAL_STEPPER STEPPER=dock_stepper GCODE_AXIS=D LIMIT_VELOCITY={cfg.velocity} LIMIT_ACCEL={cfg.accel}

[gcode_macro PROBE_ARM_OUT]
description: Move the dock arm to the probe presentation angle
gcode:
    {% if 'D' not in printer.gcode_move.axis_map %}
        PROBE_ARM_HOME
    {% endif %}
    _PROBE_ARM_MOVE ANGLE={printer['gcode_macro _PROBE_ARM'].presentation_angle}

[gcode_macro PROBE_ARM_IN]
description: Move the dock arm to the park angle
gcode:
    {% if 'D' not in printer.gcode_move.axis_map %}
        PROBE_ARM_HOME
    {% endif %}
    _PROBE_ARM_MOVE ANGLE={printer['gcode_macro _PROBE_ARM'].park_angle}

[gcode_macro _PROBE_ARM_MOVE]
gcode:
    SAVE_GCODE_STATE NAME=probe_arm_move
    G90
    G1 D{params.ANGLE} F{printer['gcode_macro _PROBE_ARM'].move_speed * 60}
    M400
    RESTORE_GCODE_STATE NAME=probe_arm_move

[gcode_macro DISABLE_STEPPER_DOCK]
description: Turn off the dock motor only (D stays registered)
gcode:
    M400
    SET_STEPPER_ENABLE STEPPER="manual_stepper dock_stepper" ENABLE=0
