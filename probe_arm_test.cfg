# ---------------------------------------------------------------------------
# Probe arm command outputs to the nRF are active-low.
# Idle and MCU shutdown must leave every command HIGH.
# ---------------------------------------------------------------------------

[output_pin probe_arm_home]
pin: PE10
value: 1
shutdown_value: 1
pwm: false

[output_pin probe_arm_out]
pin: PE9
value: 1
shutdown_value: 1
pwm: false

[output_pin probe_arm_in]
pin: PB0
value: 1
shutdown_value: 1
pwm: false


# ---------------------------------------------------------------------------
# Probe arm status inputs from nRF
#
# nRF SUCCESS output is active-high.
# nRF ERROR output is active-high.
#
# With your external pulldown resistors:
#   low  = inactive
#   high = active
#
# So do not invert these pins unless your actual wiring changes.
# ---------------------------------------------------------------------------

[gcode_button probe_arm_success]
pin: PC2
press_gcode:
    {% set s = printer["gcode_macro _PROBE_ARM_STATE"] %}
    {% if s.busy|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=result VALUE=1
        M118 Probe arm { s.op }: SUCCESS pin went high
    {% else %}
        M118 Probe arm SUCCESS pin went high while idle
    {% endif %}

[gcode_button probe_arm_error]
pin: PC5
press_gcode:
    {% set s = printer["gcode_macro _PROBE_ARM_STATE"] %}
    {% if s.busy|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=result VALUE=-1
        M118 Probe arm { s.op }: ERROR pin went high
    {% else %}
        M118 Probe arm ERROR pin went high while idle
    {% endif %}


# ---------------------------------------------------------------------------
# Internal state for the test macros
# ---------------------------------------------------------------------------

[gcode_macro _PROBE_ARM_STATE]
variable_busy: 0
variable_result: 0
variable_ticks_left: 0
variable_op: "IDLE"
gcode:


# ---------------------------------------------------------------------------
# Poller.
#
# This checks the state changed by gcode_button callbacks.
# It is not truly blocking Klipper execution; it is a simple first test of:
#   command pulse -> status input -> message/timeout
# ---------------------------------------------------------------------------

[delayed_gcode _PROBE_ARM_POLL]
gcode:
    {% set s = printer["gcode_macro _PROBE_ARM_STATE"] %}

    {% if s.result|int == 1 %}
        M118 Probe arm { s.op }: SUCCESS
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=busy VALUE=0
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=op VALUE="'IDLE'"

    {% elif s.result|int == -1 %}
        M118 Probe arm { s.op }: ERROR
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=busy VALUE=0
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=op VALUE="'IDLE'"

    {% elif s.ticks_left|int <= 0 %}
        M118 Probe arm { s.op }: TIMEOUT
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=busy VALUE=0
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=result VALUE=-2
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=op VALUE="'IDLE'"

    {% else %}
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=ticks_left VALUE={s.ticks_left|int - 1}
        UPDATE_DELAYED_GCODE ID=_PROBE_ARM_POLL DURATION=0.1
    {% endif %}


# ---------------------------------------------------------------------------
# Test macros: pulse an active-low command pattern and wait for SUCCESS /
# ERROR / timeout through the shared state machine above.
#
# TIMEOUT is in seconds.
# PULSE is in milliseconds.
#
# Example:
#   PROBE_ARM_HOME_TEST
#   PROBE_ARM_HOME_TEST TIMEOUT=15 PULSE=250
#   PROBE_ARM_OUT_TEST
#   PROBE_ARM_IN_TEST
#   PROBE_ARM_OUT_MORE_NEGATIVE_TEST
#   PROBE_ARM_OUT_LESS_NEGATIVE_TEST
# ---------------------------------------------------------------------------

[gcode_macro PROBE_ARM_HOME_TEST]
description: Pulse the nRF HOME command and report SUCCESS, ERROR, or TIMEOUT
gcode:
    {% set s = printer["gcode_macro _PROBE_ARM_STATE"] %}
    {% set timeout = params.TIMEOUT|default(10)|float %}
    {% set pulse_ms = params.PULSE|default(250)|int %}
    {% set ticks = (timeout * 10)|int %}

    {% if s.busy|int == 1 %}
        M118 Probe arm is already busy with { s.op }
    {% else %}
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=busy VALUE=1
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=result VALUE=0
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=ticks_left VALUE={ticks}
        SET_GCODE_VARIABLE MACRO=_PROBE_ARM_STATE VARIABLE=op VALUE="'HOME'"

        M118 Probe arm HOME: pulsing active-low HOME command

        SET_PIN PIN=probe_arm_home VALUE=0
        G4 P{pulse_ms}
        SET_PIN PIN=probe_arm_home VALUE=1

        UPDATE_DELAYED_GCODE ID=_PROBE_ARM_POLL DURATION=0.1
    {% endif %}


