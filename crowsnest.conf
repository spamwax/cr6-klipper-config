#### crowsnest.conf
#### This is the default config after installation.
#### It is also used as the default config in MainsailOS.
#### For details on how to configure this to your needs, see:
#### https://github.com/mainsail-crew/crowsnest/blob/master/README.md


#####################################################################
####                                                            #####
####      Information about ports and according URL's           #####
####                                                            #####
#####################################################################
####                                                            #####
####    Port 8080 equals /webcam/?action=[stream/snapshot]      #####
####    Port 8081 equals /webcam2/?action=[stream/snapshot]     #####
####    Port 8082 equals /webcam3/?action=[stream/snapshot]     #####
####    Port 8083 equals /webcam4/?action=[stream/snapshot]     #####
####                                                            #####
####    Note: These ports are default for most Mainsail         #####
####    installations. Using any other port would involve       #####
####    changing the proxy configuration or using URLs          #####
####    with the specific port like                             #####
####    http://<ip>:<port>/?action=[stream/snapshot]            #####
####                                                            #####
#####################################################################
####    RTSP Stream URL: ( if enabled and supported )           #####
####    rtsp://<ip>:<rtsp_port>/stream.h264                     #####
#####################################################################


[crowsnest]
log_path: /home/pi/printer_data/logs/crowsnest.log
log_level: verbose                      # Valid Options are quiet/verbose/debug
delete_log: false                       # Deletes log on every restart, if set to true
no_proxy: false

[cam nocturne]
mode: utreamer
enable_rtsp: true
rtsp_port: 8555
port: 8080
device: /dev/video0
resolution:  1920x1080
max_fps: 30
v4l2ctl: sharpness=5,contrast=42,hue=4,saturation=90,brightness=10,gamma=102,backlight_compensation=1,gain=0    # Add v4l2-ctl parameters to setup your camera, see Log what your cam is capable of.

# User Controls

#                      brightness 0x00980900 (int)    : min=-64 max=64 step=1 default=0 value=0
#                        contrast 0x00980901 (int)    : min=0 max=64 step=1 default=32 value=32
#                      saturation 0x00980902 (int)    : min=0 max=128 step=1 default=64 value=64
#                             hue 0x00980903 (int)    : min=-40 max=40 step=1 default=0 value=0
#         white_balance_automatic 0x0098090c (bool)   : default=1 value=1
#                           gamma 0x00980910 (int)    : min=72 max=500 step=1 default=100 value=100
#                            gain 0x00980913 (int)    : min=0 max=100 step=1 default=0 value=0
#            power_line_frequency 0x00980918 (menu)   : min=0 max=2 default=1 value=1 (50 Hz)
# 				0: Disabled
# 				1: 50 Hz
# 				2: 60 Hz
#       white_balance_temperature 0x0098091a (int)    : min=2800 max=6500 step=1 default=4600 value=4600 flags=inactive
#                       sharpness 0x0098091b (int)    : min=0 max=6 step=1 default=3 value=3
#          backlight_compensation 0x0098091c (int)    : min=0 max=2 step=1 default=1 value=1

# Camera Controls

#                   auto_exposure 0x009a0901 (menu)   : min=0 max=3 default=3 value=3 (Aperture Priority Mode)
# 				1: Manual Mode
# 				3: Aperture Priority Mode
#          exposure_time_absolute 0x009a0902 (int)    : min=1 max=5000 step=1 default=157 value=157 flags=inactive
#      exposure_dynamic_framerate 0x009a0903 (bool)   : default=0 value=1

# /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB_2.0_Camera-video-index0
# /dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.3:1.0-video-index0
# Supported formats:
# 	[0]: 'MJPG' (Motion-JPEG, compressed)
# 		Size: Discrete 1920x1080
# 			Interval: Discrete 0.033s (30.000 fps)
# 		Size: Discrete 640x480
# 			Interval: Discrete 0.033s (30.000 fps)
# 		Size: Discrete 1280x720
# 			Interval: Discrete 0.033s (30.000 fps)
# 		Size: Discrete 640x360
# 			Interval: Discrete 0.033s (30.000 fps)
# 		Size: Discrete 320x240
# 			Interval: Discrete 0.033s (30.000 fps)
# 		Size: Discrete 800x600
# 			Interval: Discrete 0.033s (30.000 fps)
# 		Size: Discrete 960x720
# 			Interval: Discrete 0.033s (30.000 fps)
# 		Size: Discrete 352x288
# 			Interval: Discrete 0.033s (30.000 fps)
# 		Size: Discrete 432x240
# 			Interval: Discrete 0.033s (30.000 fps)
