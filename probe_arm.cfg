# Blocking interface to the nRF52840 probe-arm controller.
# Command pins are active-low; status pins are active-high.

[probe_arm_controller]
home_pin: PE10
arm_out_pin: PE9
arm_in_pin: PB0
success_pin: PC2
error_pin: PC5
pulse_time: 0.250
timeout: 10.0
status_clear_timeout: 2.0
settle_time: 0.500

[gcode_macro RANDOM_MOVE]
description: Move to a random safe XYZ position within configured limits
gcode:
    {% set config = printer.configfile.settings %}
    {% set x_min = ((config.stepper_x.position_min|float) + 5.0)|round(0, 'ceil')|int %}
    {% set x_max = ((config.stepper_x.position_max|float) - 10.0)|round(0, 'floor')|int %}
    {% set y_min = ((config.stepper_y.position_min|float) + 5.0)|round(0, 'ceil')|int %}
    {% set y_max = ((config.stepper_y.position_max|float) - 10.0)|round(0, 'floor')|int %}
    {% set z_floor = [22.0, config.stepper_z.position_min|float]|max %}
    {% set z_min = z_floor|round(0, 'ceil')|int %}
    {% set z_limit = [60.0, (config.stepper_z.position_max|float) - 5.0]|min %}
    {% set z_max = z_limit|round(0, 'floor')|int %}

    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("RANDOM_MOVE requires all XYZ axes to be homed")}
    {% elif x_min > x_max or y_min > y_max or z_min > z_max %}
        {action_raise_error("RANDOM_MOVE has no valid coordinates within the configured margins")}
    {% else %}
        {% set random_x = range(x_min, x_max + 1)|random %}
        {% set random_y = range(y_min, y_max + 1)|random %}
        {% set random_z = range(z_min, z_max + 1)|random %}

        G90
        M118 Moving to X{random_x} Y{random_y} Z{random_z}
        G1 X{random_x} Y{random_y} Z{random_z} F6500
        M400
    {% endif %}

[gcode_macro _stress_test_probe_arm]
gcode:
    {% set count = 5 %}
    {% for i in range(count) %}
        M118 Stress test probe arm: cycle {i+1} of {count}
        DEPLOY_PROBE
        RANDOM_MOVE
        STOW_PROBE
        {% set delay = range(500, 2000)|random %}
        G4 P{delay}
        RANDOM_MOVE
    {% endfor %}
