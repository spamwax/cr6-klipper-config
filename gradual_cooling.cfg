[gcode_macro START_GRADUAL_COOLING]
description: Gradually cool the bed in steps over time. START TARGET STEP INTERVAL
gcode:
  {% set start = params.START|default(printer.heater_bed.target)|int %}
  {% set target = params.TARGET|default(40)|int %}
  {% set step = params.STEP|default(5)|int %}
  {% set interval = params.INTERVAL|default(900)|int %}
  {% set retry_max = params.RETRY_MAX|default(2)|int %}
  # Air Filtering variables
  {% set filt_requested  = printer["gcode_macro AIR_FILTER"].active|default(0)|int %}
  {% set filt_mins       = printer["gcode_macro AIR_FILTER"].minutes|default(0)|int %}
  {% set filt_speed      = printer["gcode_macro AIR_FILTER"].speed|default(0)|float %}
  SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=filt_requested VALUE={filt_requested}
  SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=filt_mins VALUE={filt_mins}
  SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=filt_speed VALUE={filt_speed}

  {% if filt_requested == 1 %}
    # M118 Pausing air filter for cooling step
    # We are not using AIR_FILTER_OFF macro here to avoid messing up the POWER_OFF_PRINTER sequence
    SET_FAN_SPEED FAN=fan3 SPEED=0
  {% endif %}

  {% if start <= target %}
    M118 Bed already below or at target ({target}°C). No cooling needed.
    M140 S0
    TURN_OFF_HEATERS
    M107
    POWER_OFF_PRINTER DELAY=5
  {% else %}
    M118 Gradual bed cooling started: from {start}°C to {target}°C, step={step}°C every {interval}s.
    SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=target VALUE={target}
    SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=step VALUE={step}
    SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=interval VALUE={interval}
    SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=current VALUE={start}
    SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=retry_count VALUE=0
    SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=retry_max VALUE={retry_max}

    ; Start gradual cooling and keep-alive loops
    M140 S{start - step}
    # Run GRADUAL_COOLING_EXECUTOR immediately to start the process
    UPDATE_DELAYED_GCODE ID=gradual_cooling DURATION=0.1
    # Then schedule next check after interval
    # UPDATE_DELAYED_GCODE ID=gradual_cooling DURATION={interval}
    UPDATE_DELAYED_GCODE ID=keep_alive_loop DURATION=120
    BEEP
  {% endif %}

[gcode_macro GRADUAL_COOLING_EXECUTOR]
variable_target: 40
variable_step: 5
variable_interval: 900
variable_current: 60
variable_retry_count: 0
variable_retry_max: 2
variable_filt_requested: 0
variable_filt_mins: 0
variable_filt_speed: 1.0
gcode:
  G4 P0  ; Reset idle timeout
  {% set current_temp = printer.heater_bed.temperature %}
  {% set last_target = printer.heater_bed.target %}
  {% set next_temp = last_target - step %}
  {% set rc = retry_count|int %}
  {% set max_rc = retry_max|int %}

  # Turn off air filter during controlled cooling if it is running
  
  {% if current_temp <= last_target + 0.5 or rc >= max_rc %}
    {% if last_target > target %}
      M140 S{next_temp}
      M118 Cooling step applied: {next_temp}°C
      SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=current VALUE={next_temp}
      SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=retry_count VALUE=0
      UPDATE_DELAYED_GCODE ID=gradual_cooling DURATION={interval}
    {% else %}
      M140 S0
      M118 Final target {target}°C reached. Cooling complete.
      TURN_OFF_HEATERS
      M107
      UPDATE_DELAYED_GCODE ID=keep_alive_loop DURATION=0
      # Turn air filter back on if it was running before
      {% set filt_requested  = printer["gcode_macro GRADUAL_COOLING_EXECUTOR"].filt_requested|int %}
      {% set filt_mins       = printer["gcode_macro GRADUAL_COOLING_EXECUTOR"].filt_mins|int %}
      {% set filt_speed      = printer["gcode_macro GRADUAL_COOLING_EXECUTOR"].filt_speed|float %}
      {% if filt_requested == 1 and filt_mins > 0 %}
        M118 Resuming air filter for {filt_mins} min
        AIR_FILTER MIN={filt_mins} S={filt_speed}
      {% elif filt_requested == 1 and filt_mins == 0 %}
        M118 Resuming air filter (no timer)
        AIR_FILTER S={filt_speed}
      {% endif %}
      POWER_OFF_PRINTER DELAY=1
      BEEPC COUNT=2
    {% endif %}
  {% else %}
    {% set new_rc = rc + 1 %}
    SET_GCODE_VARIABLE MACRO=GRADUAL_COOLING_EXECUTOR VARIABLE=retry_count VALUE={new_rc}
    M118 Temp plateau at {current_temp}°C (retry {new_rc}/{max_rc}). Rechecking in {interval}s.
    UPDATE_DELAYED_GCODE ID=gradual_cooling DURATION={interval}
  {% endif %}

[delayed_gcode gradual_cooling]
gcode:
  GRADUAL_COOLING_EXECUTOR

[delayed_gcode keep_alive_loop]
gcode:
  KEEP_PRINTER_ALIVE
  UPDATE_DELAYED_GCODE ID=keep_alive_loop DURATION=120

[gcode_macro KEEP_PRINTER_ALIVE]
gcode:
  G4 P0
  ;M118 Keep-alive ping (idle watchdog reset)


[gcode_macro AIR_FILTER]
description: Start air filtration, optional MIN=minutes timer
variable_active: 0
variable_minutes: 0
variable_counter: 0
variable_speed: 1
variable_expired: 1
gcode:
    {% set min = params.MIN|default(0)|int %}
    {% set speed = params.S|default(1.0)|float %}
    SET_GCODE_VARIABLE MACRO=AIR_FILTER VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=AIR_FILTER VARIABLE=expired VALUE=0
    SET_GCODE_VARIABLE MACRO=AIR_FILTER VARIABLE=speed VALUE={speed}
    {% if min > 0 %}
        SET_GCODE_VARIABLE MACRO=AIR_FILTER VARIABLE=minutes VALUE={min}
        SET_GCODE_VARIABLE MACRO=AIR_FILTER VARIABLE=counter VALUE=0
        {action_respond_info("Air filter ON for {} min".format(min))}
        UPDATE_DELAYED_GCODE ID=air_filter_tick DURATION=5
    {% else %}
        {action_respond_info("Air filter ON (no timer)")}
    {% endif %}
    # M106 P3 S{speed}
    SET_FAN_SPEED FAN=fan3 SPEED={speed}

[delayed_gcode air_filter_tick]
gcode:
    {% set active  = printer["gcode_macro AIR_FILTER"].active|int %}
    {% set mins    = printer["gcode_macro AIR_FILTER"].minutes|int %}
    {% set c       = printer["gcode_macro AIR_FILTER"].counter|int %}
    {% if active == 1 and mins > 0 %}
        {% set elapsed = (c + 1) * 5 %}
        SET_GCODE_VARIABLE MACRO=AIR_FILTER VARIABLE=counter VALUE={c + 1}
        {% if elapsed >= mins * 60 %}
            SET_GCODE_VARIABLE MACRO=AIR_FILTER VARIABLE=active VALUE=0
            SET_GCODE_VARIABLE MACRO=AIR_FILTER VARIABLE=expired VALUE=1
            {action_respond_info("Air filter timer complete")}
            # M106 P3 S0
            SET_FAN_SPEED FAN=fan3 SPEED=0
        {% else %}
            UPDATE_DELAYED_GCODE ID=air_filter_tick DURATION=5
        {% endif %}
    {% endif %}

[gcode_macro AIR_FILTER_OFF]
description: Stop air filtration and clear block
gcode:
    SET_GCODE_VARIABLE MACRO=AIR_FILTER VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=AIR_FILTER VARIABLE=expired VALUE=1
    # M106 P3 S0
    SET_FAN_SPEED FAN=fan3 SPEED=0
    {action_respond_info("Air filter OFF")}
